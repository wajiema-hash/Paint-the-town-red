<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paint The Town Red</title>
    <style>
      html,
      body,
      #gameContainer {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      html,
      body {
        position: fixed;
        inset: 0;
        background: #231f20;
      }

      #gameContainer {
        position: absolute;
        inset: 0;
        background: #231f20;
      }

      #gameContainer canvas {
        position: absolute !important;
        inset: 0;
        display: block;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>
    <script>
      // Keep all runtime files from the same Unity build. Avoid intercepting
      // fetch/XHR: the Unity loader must receive its original binary responses.
      const buildUrl = "https://cdn.jsdelivr.net/gh/reeyuki/pttrwebport@main/";
      const loader = document.createElement("script");
      loader.src = new URL("Build/UnityLoader.js", buildUrl).href;
      loader.onload = () => {
        window.gameInstance = UnityLoader.instantiate(
          "gameContainer",
          new URL("Build/WebGL-Release.json", buildUrl).href,
          {},
        );
      };
      loader.onerror = () => {
        document.body.textContent = "Could not load the Unity WebGL loader.";
      };
      document.body.appendChild(loader);

      // Unity handles the canvas backing resolution itself; notify it when the
      // preview iframe changes size so its camera viewport is recalculated.
      let resizeFrame = 0;
      const notifyUnityOfResize = () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          window.dispatchEvent(new Event("resize"));
        });
      };
      window.addEventListener("resize", notifyUnityOfResize);
      window.addEventListener("orientationchange", notifyUnityOfResize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", notifyUnityOfResize);
      }
      new ResizeObserver(notifyUnityOfResize).observe(
        document.getElementById("gameContainer"),
      );
    </script>
  </body>
</html>
