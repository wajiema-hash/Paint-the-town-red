<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paint The Town Red</title>
    <style>
      html,
      body,
      #gameContainer {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      html,
      body {
        position: fixed;
        inset: 0;
        background: #231f20;
      }

      #gameContainer {
        position: absolute;
        inset: 0;
        background: #231f20;
      }

      #gameContainer canvas {
        position: absolute !important;
        inset: 0;
        display: block;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        border: 0;
      }

      #loadError {
        position: fixed;
        z-index: 10;
        inset: auto 1rem 1rem;
        padding: 0.75rem 1rem;
        border: 1px solid #a33;
        border-radius: 0.5rem;
        background: #1b1111;
        color: #ffdede;
        white-space: pre-wrap;
        font: 14px/1.4 monospace;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>
    <script>
      // The loader is included in this repository. Load it locally so the page
      // does not depend on jsDelivr being reachable for the bootstrap script.
      // The matching hosted build config and its runtime assets are kept on
      // the same CDN because the repository stores the large data file split
      // into chunks rather than as Unity's single .data.unityweb file.
      const hostedBuild = "https://cdn.jsdelivr.net/gh/reeyuki/pttrwebport@main/";
      const loader = document.createElement("script");
      loader.src = new URL("./Build/UnityLoader.js", document.baseURI).href;
      loader.onerror = () => showLoadError("Could not load ./Build/UnityLoader.js. Confirm the preview serves the repository root.");
      loader.onload = () => {
        try {
          window.gameInstance = UnityLoader.instantiate(
            "gameContainer",
            new URL("Build/WebGL-Release.json", hostedBuild).href,
            {},
          );
        } catch (error) {
          showLoadError(error?.message || String(error));
        }
      };
      document.body.appendChild(loader);

      function showLoadError(message) {
        console.error("Unity WebGL startup error:", message);
        const panel = document.createElement("pre");
        panel.id = "loadError";
        panel.textContent = "Unity WebGL startup error: " + message;
        document.body.appendChild(panel);
      }

      const resizeObserver = new ResizeObserver(() => {
        window.dispatchEvent(new Event("resize"));
      });
      resizeObserver.observe(document.getElementById("gameContainer"));
      window.addEventListener("resize", () => {
        window.dispatchEvent(new Event("resize"));
      });
    </script>
  </body>
</html>
