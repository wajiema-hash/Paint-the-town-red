<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Paint The Town Red</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f0f0f;
        color: #e6e6e6;
        font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      #gameContainer {
        width: 100vw;
        height: 100vh;
        position: relative;
        background: #231f20;
      }
      #gameContainer canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #loadError {
        position: fixed;
        inset: auto 1rem 1rem;
        z-index: 10;
        max-height: 35vh;
        overflow: auto;
        padding: 0.75rem 1rem;
        border: 1px solid #a33;
        border-radius: 0.5rem;
        background: #1b1111;
        color: #ffdede;
        white-space: pre-wrap;
        font: 14px/1.4 monospace;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>
    <script>
      const baseUrl = new URL("./", window.location.href).href;
      const dataFile = "Build/WebGL-Release.data.unityweb";
      const chunkCount = 6;
      const assetCache = {};

      function showLoadError(error) {
        console.error("Unity WebGL failed to load:", error);
        let panel = document.getElementById("loadError");
        if (!panel) {
          panel = document.createElement("pre");
          panel.id = "loadError";
          document.body.appendChild(panel);
        }
        panel.textContent = "Unable to load the game. " + (error?.message || error);
      }

      // Array.from is intentional: Array.prototype.map skips empty array slots.
      // These assets are split into six numbered chunks in the repository.
      Promise.all(
        Array.from({ length: chunkCount }, (_, index) => {
          const url = new URL(
            `Build/WebGL-Release.data${String(index).padStart(2, "0")}`,
            baseUrl,
          );
          return fetch(url)
            .then((response) => {
              if (!response.ok) {
                throw new Error(`Could not load data chunk ${index}: HTTP ${response.status}`);
              }
              return response.arrayBuffer();
            })
            .then((buffer) => new Uint8Array(buffer));
        }),
      )
        .then((chunks) => {
          const totalLength = chunks.reduce((total, chunk) => total + chunk.length, 0);
          const combinedData = new Uint8Array(totalLength);
          let offset = 0;
          for (const chunk of chunks) {
            combinedData.set(chunk, offset);
            offset += chunk.length;
          }
          assetCache[dataFile] = combinedData;
          assetCache[dataFile.split("/").pop()] = combinedData;

          const originalFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            const url = typeof input === "string" ? input : input?.url || "";
            for (const key of Object.keys(assetCache)) {
              if (url.includes(key)) {
                return Promise.resolve(
                  new Response(assetCache[key].slice(), {
                    status: 200,
                    headers: { "Content-Type": "application/octet-stream" },
                  }),
                );
              }
            }
            return originalFetch(input, init);
          };

          const originalOpen = XMLHttpRequest.prototype.open;
          const originalSend = XMLHttpRequest.prototype.send;
          XMLHttpRequest.prototype.open = function (method, url) {
            this._unityUrl = url;
            return originalOpen.apply(this, arguments);
          };
          XMLHttpRequest.prototype.send = function () {
            const url = String(this._unityUrl || "");
            const key = Object.keys(assetCache).find((candidate) => url.includes(candidate));
            if (!key) return originalSend.apply(this, arguments);

            const request = this;
            const data = assetCache[key];
            setTimeout(() => {
              Object.defineProperty(request, "status", { value: 200, configurable: true });
              Object.defineProperty(request, "statusText", { value: "OK", configurable: true });
              Object.defineProperty(request, "readyState", { value: 4, configurable: true });
              Object.defineProperty(request, "response", {
                get: () => data.slice().buffer,
                configurable: true,
              });
              Object.defineProperty(request, "responseText", { value: "", configurable: true });
              Object.defineProperty(request, "responseURL", { value: url, configurable: true });
              request.onreadystatechange?.(new Event("readystatechange"));
              request.onload?.(
                new ProgressEvent("load", {
                  lengthComputable: true,
                  loaded: data.length,
                  total: data.length,
                }),
              );
              request.dispatchEvent(new Event("load"));
              request.dispatchEvent(new Event("loadend"));
              request.onloadend?.(new ProgressEvent("loadend"));
            }, 0);
          };

          const loader = document.createElement("script");
          loader.src = new URL("Build/UnityLoader.js", baseUrl).href;
          loader.onerror = () => showLoadError(new Error("Could not load Build/UnityLoader.js"));
          loader.onload = () => {
            try {
              window.gameInstance = UnityLoader.instantiate(
                "gameContainer",
                new URL("Build/WebGL-Release.json", baseUrl).href,
                {},
              );
            } catch (error) {
              showLoadError(error);
            }
          };
          document.body.appendChild(loader);
        })
        .catch(showLoadError);
    </script>
  </body>
</html>
